services:
  verdant-app:
    build:
      context: .
      dockerfile: Dockerfile.dev-static
    container_name: verdant-fleet-v2-dev-static
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=false
      - NODE_ENV=development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stdin_open: true
    tty: true
