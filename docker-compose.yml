services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_WATCH_USEPOLLING=true
      - NODE_ENV=development
    env_file:
      - .env
    stdin_open: true
    tty: true
    restart: unless-stopped