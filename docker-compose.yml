services:
  verdant-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=2000
      - NODE_ENV=development
      - DOCKER=1
    volumes:
      - .:/app
      - /app/node_modules # Isolation du node_modules conteneur
    restart: unless-stopped
    stdin_open: true
    tty: true