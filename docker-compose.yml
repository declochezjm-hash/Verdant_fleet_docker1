services:
  verdant-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules # Isolation du node_modules conteneur
    restart: unless-stopped
    stdin_open: true
    tty: true