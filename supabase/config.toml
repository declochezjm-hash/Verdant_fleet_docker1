# Stack Supabase local (conteneurs Docker via `npx supabase start`)
project_id = "verdant_fleet"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "http://localhost:3000"]
enable_signup = true

[auth.email]
enable_signup = true
# Inscription utilisable tout de suite sans e-mail (Inbucket : http://127.0.0.1:54324)
enable_confirmations = false

[analytics]
enabled = false
